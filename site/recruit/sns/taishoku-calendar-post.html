<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#fff6ee;font-family:"Noto Sans JP","IPAPGothic",sans-serif;color:#2b2420;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.b1{width:520px;height:520px;background:#ffe2c6;top:-180px;right:-160px}
.b2{width:380px;height:380px;background:#ffeedd;bottom:-120px;left:-120px}
.wrap{position:relative;padding:64px 84px 0}
.label{display:inline-block;background:#ef7d2d;color:#fff;font-weight:700;font-size:30px;padding:10px 26px;border-radius:999px;letter-spacing:.06em}
.quote{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:68px;line-height:1.3;margin-top:34px;letter-spacing:.02em}
.quote .hl{background:linear-gradient(transparent 62%,#ffd2a8 62%)}
.sub{font-size:36px;font-weight:700;color:#6b5a50;margin-top:18px}
.card{margin-top:36px;background:#fff;border-radius:36px;padding:34px 46px 20px;box-shadow:0 18px 50px rgba(160,90,30,.14)}
.sel{display:flex;align-items:center;justify-content:space-between;border:3px solid #f3d9c4;border-radius:18px;padding:18px 26px;font-size:30px;font-weight:700}
.sel small{display:block;font-size:22px;color:#a08a7c;font-weight:500;margin-bottom:2px}
.sel .arrow{color:#ef7d2d;font-size:28px}
.tl{position:relative;margin-top:30px;padding-left:46px}
.tl:before{content:"";position:absolute;left:14px;top:14px;bottom:20px;width:4px;background:#f6dcc6;border-radius:2px}
.row{position:relative;display:flex;align-items:center;gap:18px;padding:12px 0}
.row:before{content:"";position:absolute;left:-44px;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #ef7d2d}
.row.now:before{background:#ef7d2d}
.when{font-size:26px;font-weight:700;color:#ef7d2d;min-width:150px}
.what{font-size:33px;font-weight:700}
.badge{font-size:22px;font-weight:700;color:#fff;background:#ef7d2d;border-radius:999px;padding:4px 16px}
.dots{font-size:26px;color:#d9bfa9;padding:2px 0 2px 0;letter-spacing:.3em}
.cta{margin-top:34px;text-align:center}
.cta p{font-size:38px;font-weight:900;line-height:1.5}
.cta p b{color:#ef7d2d}
.pill{display:inline-block;margin-top:20px;background:#2b2420;color:#fff;font-size:32px;font-weight:700;padding:20px 48px;border-radius:999px;display:inline-flex;align-items:center;gap:14px}
.ck{width:40px;height:40px}
.foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:24px;color:#a08a7c;font-weight:700;letter-spacing:.08em}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <span class="label">先生のための 退職逆算カレンダー</span>
  <h1 class="quote">「辞めたい。」<br>でも、<span class="hl">子どもたちを</span><br><span class="hl">不安にさせたくない。</span></h1>
  <p class="sub">そんな先生へ。子どもの毎日が途切れない辞め方を。</p>

  <div class="card">
    <div class="sel"><div><small>辞めたい時期</small>2027年3月末（年度末）</div><span class="arrow">▼</span></div>
    <div class="tl">
      <div class="row"><span class="when">6か月前</span><span class="what">気持ちとお金を整理する</span></div>
      <div class="row"><span class="when">3か月前</span><span class="what">管理職に意思を伝える</span></div>
      <div class="row"><span class="when">2か月前</span><span class="what">引き継ぎを始める</span></div>
      <div class="row"><span class="when">退職後</span><span class="what">退職後すぐの手続き</span></div>
    </div>
  </div>

  <div class="cta">
    <p>辞めたい時期を選ぶだけで、<br><b>今月やること</b>が一覧で分かる</p>
    <span class="pill">URLからチェック<svg class="ck" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="5" fill="#3fb950"/><path d="M6.5 12.5l3.6 3.6 7.4-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
</div>
<div class="foot">NIJIN 採用サイト｜教育キャリアコラム</div>
</body></html>
