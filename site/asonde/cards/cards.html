<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Noto Sans CJK JP","Hiragino Maru Gothic ProN",sans-serif}
.c{width:800px;height:600px;position:relative;overflow:hidden}
#kz{background:radial-gradient(circle at 20% 20%,#fff6e0,#f3e9ff 70%)}
#kz img{position:absolute;width:150px}
#kz .bub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#8a6bd1;color:#fff;border-radius:40px;padding:22px 40px;font-size:56px;font-weight:900;letter-spacing:.04em;white-space:nowrap;box-shadow:0 10px 0 #6a4fb3}
#kz .bub small{display:block;font-size:26px;letter-spacing:.1em;text-align:center;opacity:.95}
#nm{background:linear-gradient(135deg,#f0655a,#ff9b5e 55%,#ffc24b)}
#nm .tag{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-4deg);width:520px;background:#fff;border:8px solid #e94b3c;border-radius:36px;overflow:hidden;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2)}
#nm .top{background:#e94b3c;color:#fff;font-size:44px;font-weight:900;padding:18px 0 10px;letter-spacing:.08em}
#nm .top small{display:block;font-size:20px;letter-spacing:.2em}
#nm .nm{font-size:110px;font-weight:900;padding:20px 0 0;letter-spacing:.08em;color:#2b3b42}
#nm .ro{font-size:36px;font-weight:800;color:#1c5468;padding:0 0 24px}
#nm .dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
</style></head><body>
<div class="c" id="kz">
<img src="kz-ringo.webp" style="left:40px;top:40px"><img src="kz-enpitsu.webp" style="left:610px;top:30px;transform:rotate(15deg)"><img src="kz-neko.webp" style="left:30px;top:400px"><img src="kz-calendar.webp" style="left:620px;top:410px"><img src="kz-ame.webp" style="left:330px;top:20px;width:120px"><img src="kz-inu.webp" style="left:330px;top:450px;width:140px">
<div class="bub">1こ・1ぽん・1ぴき<small>かぞえかたクイズ</small></div></div>
<div class="c" id="nm"><div class="dot" style="width:260px;height:260px;left:-80px;top:-90px"></div><div class="dot" style="width:200px;height:200px;right:-60px;bottom:-70px"></div>
<div class="tag"><div class="top">はじめまして！<small>HELLO, MY NAME IS</small></div><div class="nm">エミリー</div><div class="ro">Emirī</div></div></div>
</body></html>
