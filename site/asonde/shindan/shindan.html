<style>
.l-header,.l-footer,.p-breadcrumb,.l-header__bar,.p-fixBtnWrap,.l-page__mv,.c-pageTitle{display:none!important}
.l-page,.l-container,.l-content{padding-top:0!important;margin-top:0!important}
.sd{--sky:#2f9be0;--sky-d:#1c78b8;--coral:#f0655a;--coral-d:#d94b41;--sun:#ffc24b;--ink:#2b3b42;--soft:#5f6f75;--line:#d9e9f5;

.sd *{box-sizing:border-box}
.sd [hidden]{display:none!important}
.sd h1,.sd h2{background:none!important;border:0!important;padding:0!important;margin:0;color:var(--ink)!important}
.sd h1::before,.sd h1::after,.sd h2::before,.sd h2::after{display:none!important}
.sd button{font-family:inherit;cursor:pointer;margin:0}
.sd-app{position:relative;background:linear-gradient(180deg,#e8f5ff 0%,#fff8ee 100%);border-radius:30px;overflow:hidden;box-shadow:0 18px 40px -20px rgba(28,120,184,.45);min-height:560px}
.sd-app::before,.sd-app::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.sd-app::before{width:220px;height:220px;right:-70px;top:-80px;background:radial-gradient(circle,#ffe7a8,rgba(255,231,168,0) 70%)}
.sd-app::after{width:260px;height:260px;left:-110px;bottom:-120px;background:radial-gradient(circle,#ffd6d1,rgba(255,214,209,0) 70%)}
.sd-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}

.sd-logo{font-size:.68rem;font-weight:800;letter-spacing:.18em;color:var(--sky-d)}
.sd-body{position:relative;z-index:1;padding:14px 20px 24px}
.sd-screen{animation:sdIn .45s ease both}
@keyframes sdIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sd-title{text-align:center;margin:6px 0 14px}
.sd-title small{display:block;font-size:.72rem;letter-spacing:.2em;color:var(--coral);font-weight:800}
.sd-title b{display:block;font-size:1.9rem;font-weight:900;line-height:1.3}
.sd-title span{display:block;font-size:.8rem;color:var(--soft);font-weight:700;margin-top:2px}
.sd-hero{width:100%;aspect-ratio:16/10;border-radius:22px;overflow:hidden;box-shadow:0 10px 24px -12px rgba(0,0,0,.35);margin-bottom:16px}

.sd-faces{display:flex;justify-content:center;gap:10px;margin:0 0 14px}

.sd-lead{text-align:center;font-size:.95rem;line-height:1.8;margin:0 0 6px;font-weight:700}

.sd-main:active{transform:translateY(3px);box-shadow:0 3px 0 var(--coral-d)}
.sd-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 18px}
.sd-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),#64c3ff);border-radius:99px;transition:width .4s ease}
.sd-qno{font-size:.85rem;font-weight:800;letter-spacing:.08em;color:var(--sky-d)}
.sd-qno em{font-style:normal;font-size:1.3rem;margin-left:2px}
.sd-q{font-size:1.4rem;font-weight:900;line-height:1.55;margin:6px 0 18px;min-height:2.2em}
.sd-opts{display:grid;gap:12px}

.sd-opt:nth-child(2){animation-delay:.06s}.sd-opt:nth-child(3){animation-delay:.12s}
.sd-opt:hover{transform:translateY(-2px);border-color:#bfe2fa}
.sd-opt i{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:1.7rem;background:linear-gradient(135deg,#eaf6ff,#fff3dd)}
.sd-opt b{font-size:1rem;font-weight:800;line-height:1.5;color:var(--ink)}
.sd-opt.on{background:#fff;border-color:var(--sky);transform:scale(1.02)}
.sd-opt.on i{background:var(--sky);filter:saturate(1.2)}
.sd-opt:disabled{cursor:default}
.sd-cheer{text-align:center;font-weight:900;color:var(--coral);min-height:1.6em;margin-top:12px}
.sd-wait{text-align:center;padding-top:16px}
.sd-ring{position:relative;width:230px;height:230px;margin:10px auto 26px}
.sd-ring .sd-dots{position:absolute;inset:0;width:100%;height:100%;animation:sdSpin 2.4s linear infinite}
.sd-ring .sd-dots circle{fill:none;stroke-linecap:round}
@keyframes sdSpin{to{transform:rotate(360deg)}}
.sd-photo{position:absolute;inset:26px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.sd-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.sd-photo img.on{opacity:1}
.sd-photo::after{content:"";position:absolute;inset:0;background:rgba(20,60,90,.35)}
.sd-photo span{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.5rem;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.sd-photo span small{font-size:.75rem;font-weight:700;margin-bottom:4px}
.sd-ok{z-index:3;position:absolute;inset:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:4.4rem;color:var(--sky);animation:sdPop .45s ease both}
@keyframes sdPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.sd-thanks{font-size:1.15rem;font-weight:900;margin:0 0 6px}
.sd-wait p{color:var(--soft);font-size:.86rem;line-height:1.8;margin:0}
.sd-res-h{text-align:center;font-size:1.5rem;font-weight:900;margin:2px 0 14px}
.sd-card{position:relative;background:#fff;border-radius:26px;padding:22px 18px 18px;text-align:center;box-shadow:0 14px 30px -16px rgba(28,120,184,.5);border:3px solid var(--tc,#2f9be0)}
.sd-card small{display:block;font-size:.72rem;letter-spacing:.2em;color:var(--soft);font-weight:800}
.sd-avatar{width:150px;height:150px;margin:12px auto 10px;border-radius:50%;overflow:hidden;border:6px solid var(--tc,#2f9be0);box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.sd-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.sd-name{font-size:1.7rem;font-weight:900;color:var(--tc,#2f9be0)}
.sd-quote{display:inline-block;background:#fff7e3;border-radius:16px;padding:8px 14px;margin:10px 0;font-weight:800;font-size:.95rem;line-height:1.6}
.sd-desc{text-align:left;font-size:.92rem;line-height:1.85;margin:4px 0 6px}
.sd-scores{display:grid;gap:8px;margin:14px 0 4px}
.sd-sc{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:800}
.sd-sc img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.sd-sc span{flex:0 0 84px;text-align:left}
.sd-sc u{flex:1;height:10px;border-radius:99px;background:#eef3f6;overflow:hidden;text-decoration:none}
.sd-sc u i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s ease .2s}
.sd-sc em{flex:0 0 38px;text-align:right;font-style:normal;color:var(--soft)}
.sd-acts{display:grid;gap:10px;margin-top:16px}
.sd-sub{display:block;width:100%;border-radius:999px;padding:13px;font-weight:800;font-size:.95rem;text-align:center;text-decoration:none!important;border:3px solid var(--sky);background:#fff;color:var(--sky-d)!important}
.sd-line{background:#06C755!important;border-color:#06C755!important;color:#fff!important}
.sd-msg{text-align:center;font-size:.8rem;color:var(--soft);min-height:1.2em}
@media (prefers-reduced-motion:reduce){.sd *{animation:none!important;transition:none!important}}
</style>
